services:
  pm-agent:
    build: .
    image: ${PM_AGENT_IMAGE:-pm-agent:local}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PM_SOURCE: redmine
      SNAPSHOT_DIRECTORY: /app/data/snapshots
      DAILY_REPORT_DIRECTORY: /app/data/daily_reports
      RUN_LOG_DIRECTORY: /app/data/logs
      REPORT_TIMEZONE: Asia/Ho_Chi_Minh
      PM_TIMEZONE: Asia/Ho_Chi_Minh
    expose: ["8090"]
    volumes: ["pm-agent-data:/app/data"]
    networks:
      hub-network:
        aliases: [pm-agent]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pm-agent-data:
networks:
  hub-network:
    external: true
    name: ${BUSINESSHUB_DOCKER_NETWORK:?Set BUSINESSHUB_DOCKER_NETWORK to the existing Hub network}
